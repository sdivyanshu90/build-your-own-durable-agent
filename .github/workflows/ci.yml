name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install exact development dependencies
        run: python -m pip install --constraint requirements.lock -e '.[dev,pdf,postgres]'
      - name: Validate direct dependency lock
        run: python scripts/validate_dependency_lock.py
      - name: Formatting
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Static typing
        run: mypy src
      - name: Documentation links and required guides
        run: python scripts/validate_docs.py
      - name: Unit and property tests
        run: pytest tests/unit tests/property -q
      - name: Integration and contract tests
        run: pytest tests/integration tests/contract -q
      - name: End-to-end and fault tests
        run: pytest tests/end_to_end tests/fault_injection -q
      - name: Security tests
        run: pytest tests/security -q
      - name: Coverage quality gate
        run: pytest -m 'not performance' --cov=src/durable_agent --cov-branch --cov-report=term-missing --cov-report=xml
      - name: Static security scan
        run: bandit -c pyproject.toml -r src
      - name: Dependency vulnerability audit
        run: pip-audit
      - name: Migration upgrade validation
        run: python scripts/validate_migrations.py
      - name: Build package
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag durable-agent:test .
