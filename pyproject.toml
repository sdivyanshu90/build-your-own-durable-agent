[build-system]
requires = ["setuptools==69.1.0", "wheel==0.37.1"]
build-backend = "setuptools.build_meta"

[project]
name = "durable-coding-research-agent"
version = "0.1.0"
description = "Local-first durable execution for coding and evidence-based research agents"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Durable Agent Contributors" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "aiosqlite==0.20.0",
  "alembic==1.18.5",
  "fastapi==0.139.2",
  "httpx==0.28.1",
  "jsonschema==4.26.0",
  "opentelemetry-api==1.31.1",
  "pathspec==1.1.1",
  "prometheus-client==0.25.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "PyYAML==6.0.2",
  "SQLAlchemy[asyncio]==2.0.51",
  "structlog==24.2.0",
  "typer==0.27.0",
  "uvicorn==0.46.0",
]

[project.optional-dependencies]
dev = [
  "bandit==1.9.4",
  "build==1.2.2.post1",
  "hypothesis==6.152.7",
  "mypy==1.10.0",
  "packaging==25.0",
  "pip-audit==2.9.0",
  "pre-commit==4.2.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.2.0",
  "pytest-cov==7.1.0",
  "ruff==0.15.22",
  "types-PyYAML==6.0.12.20250516",
  "tomli==2.4.1; python_version < '3.11'",
]
pdf = ["pypdf==6.0.0"]
postgres = ["asyncpg==0.30.0", "psycopg[binary]==3.2.9"]

[project.scripts]
durable-agent = "durable_agent.cli.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
durable_agent = ["py.typed"]

[tool.setuptools.data-files]
"share/durable-agent" = ["alembic.ini"]
"share/durable-agent/migrations" = [
  "migrations/env.py",
  "migrations/script.py.mako",
]
"share/durable-agent/migrations/versions" = ["migrations/versions/*.py"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
norecursedirs = [".*", "*.egg", "build", "dist", "node_modules", "venv", "tests/fixtures"]
markers = [
  "integration: exercises infrastructure boundaries",
  "e2e: complete offline workflows",
  "performance: local measurement, excluded from default coverage claims",
  "security: implemented security controls",
]

[tool.coverage.run]
branch = true
source = ["durable_agent"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
  '\.\.\.',
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "C4", "DTZ", "G", "PIE", "PT", "RSE", "RET", "SIM", "T20", "ARG", "PTH", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG", "S101"]
"scripts/**/*.py" = ["T20"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["durable_agent"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["alembic.*", "jsonschema.*", "pathspec.*", "prometheus_client.*"]
ignore_missing_imports = true

[tool.bandit]
targets = ["src"]
exclude_dirs = ["tests"]
skips = ["B404", "B603"]

[tool.pydantic-mypy]
init_forbid_extra = true
warn_required_dynamic_aliases = true
